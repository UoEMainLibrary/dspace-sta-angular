<div class="item-page-field">
  <ds-metadata-values
    [mdValues]="item?.allMetadata(fields)"
    [separator]="separator"
    [label]="label"
    [enableMarkdown]="enableMarkdown"
    [urlRegex]="urlRegex"
    [browseDefinition]="browseDefinition|async"
    [img]="img"
  ></ds-metadata-values>
  <ds-metadata-uri-values-labelless [mdValues]="item?.allMetadata(uriFields)" [separator]="separator" [label]="label"></ds-metadata-uri-values-labelless>
</div>
